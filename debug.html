<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>B38 preview — viewport diagnostic</title>
<style>
  :root{--bg:#0b0b0b;--fg:#f2f2f2;--mut:#8a8a8a;--ok:#35c759;--bad:#ff4136;--line:rgba(255,255,255,.1)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;
       padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px)}
  h1{font-size:17px;margin:0 0 4px}
  p.sub{color:var(--mut);font-size:13px;margin:0 0 16px}
  div.row{display:flex;justify-content:space-between;gap:12px;
          padding:9px 0;border-bottom:1px solid var(--line)}
  span.k{color:var(--mut);font-size:13px}
  span.v{font-family:ui-monospace,monospace;font-size:13px;text-align:right}
  .ok{color:var(--ok)} .bad{color:var(--bad)}
  #verdict{margin:16px 0;padding:14px;border-radius:12px;font-weight:600;text-align:center}
</style>
</head>
<body>
<h1>B38 preview — viewport diagnostic</h1>
<p class="sub">Screenshot this whole page and send it back.</p>
<div id="verdict">measuring…</div>
<div id="out"></div>
<script>
function px(n){ return Math.round(n)+'px'; }
function inset(side){
  var d=document.createElement('div');
  d.style.cssText='position:fixed;'+side+':0;height:0;width:0;padding-'+side+':env(safe-area-inset-'+side+')';
  document.body.appendChild(d);
  var v=getComputedStyle(d)['padding'+side[0].toUpperCase()+side.slice(1)];
  d.remove(); return v;
}
var mq = window.matchMedia('(max-width: 520px)').matches;
var rows = [
  ['window.innerWidth',  innerWidth+'px',  innerWidth<=520],
  ['window.innerHeight', innerHeight+'px', null],
  ['visualViewport',     window.visualViewport ? px(visualViewport.width)+' x '+px(visualViewport.height) : 'n/a', null],
  ['screen',             screen.width+' x '+screen.height, null],
  ['devicePixelRatio',   String(devicePixelRatio), null],
  ['media (max-width:520px)', mq ? 'MATCHES' : 'DOES NOT MATCH', mq],
  ['safe-area top',      inset('top'),    null],
  ['safe-area bottom',   inset('bottom'), null],
  ['100svh supported',   CSS.supports('height','100svh') ? 'yes' : 'no', CSS.supports('height','100svh')],
  [':has() supported',   CSS.supports('selector(:has(*))') ? 'yes' : 'no', CSS.supports('selector(:has(*))')],
  ['userAgent',          navigator.userAgent, null]
];
document.getElementById('out').innerHTML = rows.map(function(r){
  var cls = r[2]===true ? ' ok' : (r[2]===false ? ' bad' : '');
  return '<div class="row"><span class="k">'+r[0]+'</span><span class="v'+cls+'">'+r[1]+'</span></div>';
}).join('');
var v=document.getElementById('verdict');
if(mq){ v.textContent='✓ Viewport is correct — mobile layout will apply';
        v.style.cssText+='background:rgba(53,199,89,.15);color:#35c759'; }
else  { v.textContent='✗ Viewport is '+innerWidth+'px — mobile layout will NOT apply';
        v.style.cssText+='background:rgba(255,65,54,.15);color:#ff4136'; }
</script>
</body>
</html>
